title: Pitiful Takes
tagline: Sports Podcast
description: >-
  The official blog of the Pitiful Takes Sports Podcast. Bad opinions,
  delivered with full confidence.
# The site's address. The CNAME file in this repo must match the domain.
url: "https://pitifultakes.com"
baseurl: ""

# Where people can find the show. Leave blank ("") to hide a link.
links:
  spotify: ""
  apple: ""
  youtube: ""
  instagram: ""
  tiktok: ""

permalink: /takes/:year/:month/:title/
timezone: America/New_York
markdown: kramdown
highlighter: rouge
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, pitiful: 3, sport: other }
