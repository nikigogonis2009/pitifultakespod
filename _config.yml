title: Pitiful Takes
tagline: Sports Podcast
description: >-
  The official blog of the Pitiful Takes Sports Podcast. Bad opinions,
  delivered with full confidence.
# The site's address. The CNAME file in this repo must match the domain.
url: "https://pitifultakes.com"
baseurl: ""

# Where people can find the show. Leave blank ("") to hide a link.
links:
  spotify: ""
  apple: ""
  youtube: ""
  instagram: ""
  tiktok: ""

permalink: /takes/:year/:month/:title/
timezone: America/New_York
# Posts (and the Wrapped page) dated in the future stay hidden until that date and time.
# The site rebuilds every 15 minutes (.github/workflows/pages.yml), so they appear on schedule.
collections:
  wrapped:
    output: true
    permalink: /wrapped/

markdown: kramdown
highlighter: rouge
exclude:
  - README.md
  - WRITING.md
  - Gemfile
  - .github
  - Gemfile.lock
  - vendor

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, pitiful: 3, sport: other }
